name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Apply the committed migrations to the production Postgres BEFORE the
      # build. The new code (remote session revocation, login history, 2FA)
      # queries tables/columns that must exist at runtime — deploying first
      # would 500 every protected route. `vercel env pull` fetches the
      # production DATABASE_URL; `migrate deploy` is the README's documented
      # production procedure. If a migration fails the job stops here and
      # production keeps serving the previous release (safe failure mode).
      - name: Install dependencies (for Prisma CLI)
        run: npm ci

      - name: Apply database migrations (production)
        run: |
          vercel env pull --yes --environment=production .env.production --token=${{ secrets.VERCEL_TOKEN }}
          node scripts/switch-provider.js postgresql
          set -a
          . ./.env.production
          set +a
          npx prisma migrate deploy

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
