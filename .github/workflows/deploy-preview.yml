name: Deploy Preview (Vercel)

# Deploys a Vercel preview environment for every pull request (and for each
# new push to the PR) and posts/updates a comment with the preview URL.
# Mirrors the Vercel CLI approach of deploy.yml (production), so both share
# the same secrets (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID).
#
# Requirements (set once in the repo/dashboard):
#   - secrets.VERCEL_TOKEN        — Vercel access token
#   - secrets.VERCEL_ORG_ID       — Vercel team/user ID
#   - secrets.VERCEL_PROJECT_ID   — Vercel project ID
#   - Preview environment variables configured in the Vercel project
#     (the build itself is executed remotely by `vercel build`).
on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

permissions:
  contents: read
  statuses: write # commit status do e2e no preview

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Pull Vercel Environment Information (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts (preview)
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Preview to Vercel
        id: deploy
        run: |
          PREVIEW_URL="$(vercel deploy --prebuilt --yes --token=${{ secrets.VERCEL_TOKEN }} | grep -oE 'https://[a-zA-Z0-9-]+\.vercel\.app' | head -1)"
          echo "url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"

      - name: Comment Preview URL on PR
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- vercel-preview -->';
            const body = `${marker}\n🚀 **Preview deploy disponível:** ${url || '*deployment concluído (URL não capturada)*'}\n\nGerado automaticamente para cada push neste PR.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # ── E2E contra o deployment de preview (mesmo fluxo da produção) ──────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: E2E no preview
        id: e2e
        if: steps.deploy.outputs.url != ''
        env:
          E2E_BASE: ${{ steps.deploy.outputs.url }}
        run: node scripts/e2e-production.mjs

      - name: Commit status do e2e (preview)
        if: always() && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE="${{ steps.e2e.outcome }}"
          case "$STATE" in
            success) DESC="E2E preview: ✓ todos os fluxos passaram" ;;
            failure) DESC="E2E preview: ✗ falhou — veja o log da run" ;;
            *)        DESC="E2E preview: $STATE" ;;
          esac
          if [ "$STATE" = "success" ] || [ "$STATE" = "failure" ]; then
            gh api repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
              -f state="$STATE" \
              -f context=e2e-preview \
              -f description="$DESC" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          else
            echo "e2e $STATE — sem status de sucesso/falha para reportar"
          fi
